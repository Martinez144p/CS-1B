<h1 >Lab Activity 3</h1>

<script>
function togglePassword() {
    let pass = document.getElementById("psw");
    let confirm = document.getElementById("psw-repeat");

    if (pass.type === "password") {
        pass.type = "text";
        confirm.type = "text";
    } else {
        pass.type = "password";
        confirm.type = "password";
    }
}

function RegistrationSummary(event){
    event.preventDefault();

    let name = document.getElementById("fullName").value;
    let email = document.getElementById("email").value;
    let psw = document.getElementById("psw").value;
    let psw_repeat = document.getElementById("psw-repeat").value;
    let age = document.getElementById("age").value;
    let country = document.getElementById("country").value;

    let gender = "";
    if (document.getElementById("male").checked) gender = "Male";
    else if (document.getElementById("female").checked) gender = "Female";
    else if (document.getElementById("other").checked) gender = "Other";

    // ✅ Basic validation without trim
    if (name === "" || email === "" || psw === "" || psw_repeat === "" || age === "" || gender === "" || country === "") {
        alert("Please fill out all fields.");
        return;
    }

    if (psw !== psw_repeat) {
        alert("Passwords do not match.");
        return;
    }

    alert(
        "REGISTRATION SUMMARY\n\n" +
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Age: " + age + "\n" +
        "Gender: " + gender + "\n" +
        "Country: " + country
    );
}
</script>
<div class="main-box">

<h1>Registration Form</h1>

<form>

<label>Full Name</label>
<input type="text" id="fullName" placeholder="Enter Full Name">

<label>Email</label>
<input type="text" id="email" placeholder="Enter Email">

<label>Password</label>
<input type="password" id="psw" placeholder="Enter Password">

<label>Confirm Password</label>
<input type="password" id="psw-repeat" placeholder="Confirm Password">

<button type="button" onclick="togglePassword()">Show / Hide Password</button>

<label>Age</label>
<input type="number" id="age" placeholder="Enter Age">



<label>Gender</label>
<div class="radio-group">
    <input type="radio" name="gender" id="male"> Male<br>
    <input type="radio" name="gender" id="female"> Female<br>
    <input type="radio" name="gender" id="other"> Other
</div>

<label>Country</label>
<select id="country">
    <option value="">-- Select Country --</option>
    <option>Philippines</option>
    <option>Japan</option>
    <option>Korea</option>
    <option>USA</option>
    <option>Canada</option>
    <option>Australia</option>
    <option>UK</option>
    <option>Germany</option>
    <option>France</option>
    <option>Italy</option>
</select>

<div class="checkbox-group">
    <input type="checkbox"> I agree to Terms and Condition
</div>

<div class="btn-group">
    <button type="reset">Clear</button>
    <button type="submit" onclick="RegistrationSummary(event)">Register</button>
</div>

</form>
